<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Excalidraw E0 spike</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, sans-serif;
        background: #1e1e1e;
        color: #e6e6e6;
      }
      #card,
      #fullscreen {
        position: relative;
        background: #fff;
      }
      #card {
        width: 900px;
        height: 460px;
        margin: 12px;
        border: 1px solid #444;
      }
      #fullscreen {
        position: fixed;
        inset: 0;
        display: none;
        z-index: 10;
      }
      #fullscreen.active {
        display: block;
      }
      #host {
        width: 100%;
        height: 100%;
      }
      #controls {
        position: relative;
        z-index: 50;
        padding: 8px 12px;
        display: flex;
        gap: 8px;
        background: #1e1e1e;
      }
      button {
        font: inherit;
        padding: 4px 10px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <button id="move">移动到全屏</button>
      <button id="back">回到卡片</button>
      <button id="remount">重新挂载</button>
      <span id="status"></span>
    </div>
    <div id="card"><div id="host"></div></div>
    <div id="fullscreen"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
