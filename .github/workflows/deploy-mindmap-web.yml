name: Deploy mindmap-web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mindmap-web/**'
      - 'packages/ui/**'
      - 'packages/mindmap-core/**'
      - '.github/workflows/deploy-mindmap-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先构建 workspace 依赖（ui / mindmap-core 的 dist），测试和自身构建都依赖它们
      - name: Build workspace dependencies
        run: pnpm --filter '@tnotesjs/mindmap-web^...' --if-present run build

      - name: Test
        run: pnpm --filter @tnotesjs/mindmap-web test

      - name: Build
        run: pnpm --filter @tnotesjs/mindmap-web run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/mindmap-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
